</div>
<!-- Merchant / Category Selector Pill -->

<span class="text-[14px]">🍔</span>

</button>
</div>
<!-- Action Helpers Row -->
<div class="flex items-center justify-center gap-2 overflow-x-auto py-1">
<button class="bg-surface-container text-on-surface font-label-caps text-label-caps py-2 px-3.5 rounded-full flex items-center gap-1.5 hover:bg-surface-container-high transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined text-[16px]">bolt</span>
<span>split bill</span>
</button>
<button class="bg-surface-container text-on-surface font-label-caps text-label-caps py-2 px-3.5 rounded-full flex items-center gap-1.5 hover:bg-surface-container-high transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined text-[16px]">attach_file</span>
<span>scan receipt</span>
</button>
<button class="bg-surface-container text-on-surface font-label-caps text-label-caps py-2 px-3.5 rounded-full flex items-center gap-1.5 hover:bg-surface-container-high transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined text-[16px]">credit_card</span>
<span>cash / bank</span>
<span class="material-symbols-outlined text-[14px] text-secondary">expand_more</span>
</button>
</div>
<!-- Note / Tag Input Row -->
<div class="w-full px-2 pt-1 pb-2">
<div class="flex items-center gap-2 bg-surface-container-low px-4 py-2.5 rounded-full">
<span class="material-symbols-outlined text-[18px] text-secondary">edit_note</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-secondary focus:outline-none" id="note-input" placeholder="add note or #tags..." type="text"/>
<button aria-label="Clear note" class="text-secondary hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-[16px]">tag</span>
</button>
</div>
</div>
<!-- Numeric Dial Pad (4x3 Grid) -->
<div class="grid grid-cols-3 gap-y-3 gap-x-6 max-w-[320px] mx-auto w-full pt-1 pb-2">
<!-- Row 1 -->
<button class="keypad-btn w-16 h-16 rounded-full bg-surface-container hover:bg-surface-container-high active:bg-primary active:text-on-primary font-numeric-tabular text-headline-md text-on-surface flex items-center justify-center mx-auto transition-transform active:scale-95" data-key="1" type="button">
      1
    </button>
<button class="keypad-btn w-16 h-16 rounded-full bg-surface-container hover:bg-surface-container-high active:bg-primary active:text-on-primary font-numeric-tabular text-headline-md text-on-surface flex items-center justify-center mx-auto transition-transform active:scale-95" data-key="2" type="button">
      2
    </button>
<button class="keypad-btn w-16 h-16 rounded-full bg-surface-container hover:bg-surface-container-high active:bg-primary active:text-on-primary font-numeric-tabular text-headline-md text-on-surface flex items-center justify-center mx-auto transition-transform active:scale-95" data-key="3" type="button">

      6

<!-- Row 3 -->
<button class="keypad-btn w-16 h-16 rounded-full bg-surface-container hover:bg-surface-container-high active:bg-primary active:text-on-primary font-numeric-tabular text-headline-md text-on-surface flex items-center justify-center mx-auto transition-transform active:scale-95" data-key="7" type="button">
      7
    </button>
<button class="keypad-btn w-16 h-16 rounded-full bg-surface-container hover:bg-surface-container-high active:bg-primary active:text-on-primary font-numeric-tabular text-headline-md text-on-surface flex items-center justify-center mx-auto transition-transform active:scale-95" data-key="8" type="button">
      8
    </button>
<button class="keypad-btn w-16 h-16 rounded-full bg-surface-container hover:bg-surface-container-high active:bg-primary active:text-on-primary font-numeric-tabular text-headline-md text-on-surface flex items-center justify-center mx-auto transition-transform active:scale-95" data-key="9" type="button">
      9
    </button>
<!-- Row 4 -->
<button class="keypad-btn w-16 h-16 rounded-full bg-surface-container hover:bg-surface-container-high active:bg-primary active:text-on-primary font-numeric-tabular text-headline-md text-on-surface flex items-center justify-center mx-auto transition-transform active:scale-95" data-key="." type="button">
      .
    </button>
<button class="keypad-btn w-16 h-16 rounded-full bg-surface-container hover:bg-surface-container-high active:bg-primary active:text-on-primary font-numeric-tabular text-headline-md text-on-surface flex items-center justify-center mx-auto transition-transform active:scale-95" data-key="0" type="button">
      0
    </button>
<button class="w-16 h-16 rounded-full bg-primary hover:opacity-90 active:scale-90 text-on-primary flex items-center justify-center mx-auto transition-all shadow-md" id="submit-btn" type="button">
<span class="material-symbols-outlined text-[26px]">check</span>
</button>
</div>
</div>
<script>
  (function() {
    let currentInput = "20.00";
    const amountEl = document.getElementById("amount-val");
    const keypadButtons = document.querySelectorAll(".keypad-btn");
    const expenseBtn = document.getElementById("type-expense");
    const incomeBtn = document.getElementById("type-income");

    function renderAmount() {
      if (!currentInput || currentInput === "0") {
        amountEl.textContent = "$0";
        return;
      }
      amountEl.textContent = "$" + currentInput;
    }

    keypadButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        const key = btn.getAttribute("data-key");
        if (key === ".") {
          if (!currentInput.includes(".")) {
            currentInput += ".";
          }
        } else {
          if (currentInput === "0" || currentInput === "20.00") {
            currentInput = key;
          } else {
            // Cap reasonable entry length
            if (currentInput.length < 9) {
              currentInput += key;
            }
          }
        }
        renderAmount();
      });
    });

    if (expenseBtn && incomeBtn) {
      expenseBtn.addEventListener("click", () => {
        expenseBtn.className = "bg-primary text-on-primary font-label-caps text-label-caps px-5 py-1.5 rounded-full transition-all";
        incomeBtn.className = "text-secondary font-label-caps text-label-caps px-5 py-1.5 rounded-full transition-all hover:text-on-surface";
      });
      incomeBtn.addEventListener("click", () => {
        incomeBtn.className = "bg-primary text-on-primary font-label-caps text-label-caps px-5 py-1.5 rounded-full transition-all";
        expenseBtn.className = "text-secondary font-label-caps text-label-caps px-5 py-1.5 rounded-full transition-all hover:text-on-surface";
      });
    }

    const submitBtn = document.getElementById("submit-btn");
    if (submitBtn) {
      submitBtn.addEventListener("click", () => {
        submitBtn.classList.add("scale-110");
        setTimeout(() => {
          submitBtn.classList.remove("scale-110");
        }, 150);
      });
    }
  })();
</script></main></body></html>
