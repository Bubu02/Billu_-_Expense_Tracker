          "body-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "500"}],

        }
      }
    }
  };
</script></head><body class="bg-[#0a0a0a] font-body-md text-on-surface antialiased min-h-screen pt-safe pb-safe flex flex-col justify-center"><main class="flex flex-col relative w-full px-margin bg-[#0a0a0a]"><div class="flex flex-col w-full min-h-[82vh] justify-between items-center select-none py-space-md">
<!-- Subtle Top Spatial Micro-indicator -->
<div class="w-full flex items-center justify-between px-space-xs pt-space-xs">
<div class="flex items-center space-x-1.5">
<div class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></div>
<span class="font-label-caps text-label-caps uppercase tracking-widest text-[#888888]">v1.0 • offline ready</span>
</div>
<div class="h-6 px-space-sm rounded-full bg-[#161616] border border-[#2a2a2a] flex items-center">
<span class="font-label-caps text-label-caps text-[#aaaaaa]">monochrome</span>
</div>
</div>
<!-- Center Stage: Hero Illustration & Orbiting Mental-Map Tags -->
<div class="relative w-full max-w-[340px] aspect-square flex items-center justify-center my-auto">
<!-- Connecting Vector Constellation Lines -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" fill="none" viewbox="0 0 340 340" xmlns="http://www.w3.org/2000/svg">
<!-- Curved connecting dotted arcs -->
<path d="M 68 85 C 105 105, 120 135, 140 150" stroke="#333333" stroke-dasharray="3 4" stroke-opacity="0.8" stroke-width="1"></path>
<path d="M 270 70 C 230 95, 205 125, 195 150" stroke="#333333" stroke-dasharray="3 4" stroke-opacity="0.8" stroke-width="1"></path>
<path d="M 40 185 C 80 180, 110 180, 130 180" stroke="#333333" stroke-dasharray="3 4" stroke-opacity="0.8" stroke-width="1"></path>
<path d="M 295 185 C 260 185, 230 185, 205 185" stroke="#333333" stroke-dasharray="3 4" stroke-opacity="0.8" stroke-width="1"></path>
<path d="M 85 275 C 110 245, 135 220, 150 205" stroke="#333333" stroke-dasharray="3 4" stroke-opacity="0.8" stroke-width="1"></path>
<path d="M 260 270 C 230 240, 205 215, 190 205" stroke="#333333" stroke-dasharray="3 4" stroke-opacity="0.8" stroke-width="1"></path>
</svg>
<!-- Center Avatar Circle Container -->
<div class="relative z-10 w-36 h-36 rounded-full bg-[#141414] border border-[#2a2a2a] shadow-2xl flex items-center justify-center p-1.5 transition-transform duration-500 hover:scale-105 active:scale-95" id="hero-avatar">
<div class="w-full h-full rounded-full overflow-hidden bg-[#101010] flex items-center justify-center">
<img alt="Pilu Character Line Art" class="w-full h-full object-cover invert brightness-125 contrast-125" src="https://lh3.googleusercontent.com/aida/ALJJyrDpMNnjojhc77tbkUFWJkiBK459sYew1814QocxFzOywLt1UXLQcTvCBdZpkgvxhl_xjCDOhNVAsCI--tOn-zLi41F0UTIZM800MpKNg8cQsqNIpYxgxvx9US_5QYLSogPaerqxRZ88x7YRI9m8VRODjXDv4rjAc9LKTsw67ckbdiI843ynR-OtJQX4QXCI591CpGh8zUqGftdjPb_UwUW_SvDNvJBKt7aOLIYVJDchnQ"/>
</div>
<!-- Subtle ring anchor tick mark -->
<div class="absolute -bottom-1 w-2 h-2 rounded-full bg-white ring-2 ring-[#0a0a0a]"></div>
</div>
<!-- Floating Pill 1: "balance" (top-left) -->
<div class="absolute top-8 left-2 z-20 px-3.5 py-1 rounded-full bg-[#161616] border border-[#2a2a2a] text-white shadow-sm cursor-pointer transition-all duration-300 hover:bg-white hover:text-black active:scale-95" data-floating-pill="">
<span class="font-numeric-sm text-numeric-sm tracking-tight">balance</span>
</div>
<!-- Floating Pill 2: "income" (top-right) -->
<div class="absolute top-4 right-5 z-20 px-3.5 py-1 rounded-full bg-[#161616] border border-[#2a2a2a] text-white shadow-sm cursor-pointer transition-all duration-300 hover:bg-white hover:text-black active:scale-95" data-floating-pill="">
<span class="font-numeric-sm text-numeric-sm tracking-tight">+ income</span>
</div>
<!-- Floating Pill 3: "expenses" (mid-left - inverted anchor) -->
<div class="absolute top-[48%] -left-1 transform -translate-y-1/2 z-20 px-4 py-1.5 rounded-full bg-[#1e1e1e] border border-[#383838] text-white shadow-lg cursor-pointer transition-all duration-300 hover:bg-white hover:text-black active:scale-95 flex items-center space-x-1.5" data-floating-pill="">
<span class="font-numeric-sm text-numeric-sm font-semibold tracking-tight">expenses</span>
<span class="text-[10px] leading-none text-white/70">●</span>
</div>
<!-- Floating Pill 4: "food" (mid-right) -->
<div class="absolute top-[48%] -right-1 transform -translate-y-1/2 z-20 px-3.5 py-1 rounded-full bg-[#161616] border border-[#2a2a2a] text-white shadow-sm cursor-pointer transition-all duration-300 hover:bg-white hover:text-black active:scale-95" data-floating-pill="">
<span class="font-numeric-sm text-numeric-sm tracking-tight">food</span>
</div>
<!-- Floating Pill 5: "travel" (bottom-left) -->
<div class="absolute bottom-6 left-5 z-20 px-3.5 py-1 rounded-full bg-[#161616] border border-[#2a2a2a] text-white shadow-sm cursor-pointer transition-all duration-300 hover:bg-white hover:text-black active:scale-95" data-floating-pill="">
<span class="font-numeric-sm text-numeric-sm tracking-tight">travel</span>
</div>
<!-- Floating Pill 6: "fun" (bottom-right) -->
<div class="absolute bottom-7 right-4 z-20 px-3.5 py-1 rounded-full bg-[#161616] border border-[#2a2a2a] text-white shadow-sm cursor-pointer transition-all duration-300 hover:bg-white hover:text-black active:scale-95" data-floating-pill="">
<span class="font-numeric-sm text-numeric-sm tracking-tight">fun ✦</span>
</div>
</div>
<!-- Bottom Branding & Action Block -->
<div class="w-full flex flex-col items-center mt-auto pb-space-sm">
<!-- Brand Title & Tagline -->
<div class="flex flex-col items-center text-center space-y-1">
<div class="flex items-center space-x-2">
<h1 class="font-headline-lg text-headline-lg text-white tracking-tighter lowercase text-4xl">pilu</h1>
<div class="h-2 w-2 rounded-full bg-white mb-1"></div>
</div>
<p class="font-body-md text-body-md text-[#8e9192] font-normal tracking-wide">
        your minimal budgeting app
      </p>
</div>
<!-- Primary Action CTA -->
<div class="w-full mt-space-lg">
<button class="w-full py-4 bg-white text-black font-body-lg text-body-lg font-medium rounded-full shadow-lg flex items-center justify-center space-x-2 transition-all duration-200 active:scale-[0.98] hover:bg-[#e5e5e5]" id="btn-get-started" type="button">
<span>get started</span>
<span class="material-symbols-outlined text-body-lg text-black">arrow_forward</span>
</button>
</div>
<!-- Secondary Restore Trigger -->
<div class="mt-space-md flex flex-col items-center">
<button class="group flex items-center space-x-1.5 py-1 px-3 rounded-full hover:bg-[#1c1c1c] transition-colors" id="btn-restore" type="button">
<span class="font-label-subtle text-label-subtle text-[#71717a]">already tracked?</span>
<span class="font-label-subtle text-label-subtle text-white font-medium underline underline-offset-4 decoration-[#3f3f46] group-hover:decoration-white transition-all">restore backup</span>
</button>
</div>
<!-- Monospaced Zen Statement -->
<div class="mt-space-md pt-space-xs flex items-center justify-center space-x-2 text-[#71717a] opacity-80">
<span class="font-label-caps text-label-caps tracking-widest uppercase text-[10px]">zero clutter • local first</span>
</div>
</div>
</div>
<script>
  (function() {
    // Micro-interaction: Organic gentle float animation on pill tags
    const pills = document.querySelectorAll('[data-floating-pill]');
    const avatar = document.getElementById('hero-avatar');

    pills.forEach((pill, idx) => {
      pill.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s, color 0.2s';
      
      pill.addEventListener('click', () => {
        // Playful bounce on tap
        pill.style.transform = 'scale(1.15) rotate(' + (idx % 2 === 0 ? '-3deg' : '3deg') + ')';
        setTimeout(() => {
          pill.style.transform = 'scale(1) rotate(0deg)';
        }, 250);

        if (avatar) {
          avatar.style.transform = 'scale(1.04)';
          setTimeout(() => { avatar.style.transform = 'scale(1)'; }, 200);
        }
      });
    });

    const getStartedBtn = document.getElementById('btn-get-started');
    if (getStartedBtn) {
      getStartedBtn.addEventListener('click', function(e) {
        this.classList.add('scale-95');
        setTimeout(() => {
          this.classList.remove('scale-95');
        }, 150);
      });
    }
  })();
</script></main></body></html>
