</head><body class="bg-surface font-body-md text-on-surface antialiased min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl border-b border-white/5"><div class="h-14 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Go Back" class="w-11 h-11 -ml-2 flex items-center justify-center text-on-surface hover:text-white/70 transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">arrow_back</span></button><h1 class="font-headline-md text-headline-md text-on-surface tracking-tight truncate max-w-[200px]">Quick Add</h1></div><div class="flex items-center gap-space-sm"><div class="w-8 h-8 rounded-full overflow-hidden flex items-center justify-center bg-surface-container ring-1 ring-white/10"><img alt="Profile" class="w-8 h-8 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida/ALJJyrDpMNnjojhc77tbkUFWJkiBK459sYew1814QocxFzOywLt1UXLQcTvCBdZpkgvxhl_xjCDOhNVAsCI--tOn-zLi41F0UTIZM800MpKNg8cQsqNIpYxgxvx9US_5QYLSogPaerqxRZ88x7YRI9m8VRODjXDv4rjAc9LKTsw67ckbdiI843ynR-OtJQX4QXCI591CpGh8zUqGftdjPb_UwUW_SvDNvJBKt7aOLIYVJDchnQ"/></div></div></div></header><main class="flex flex-col relative w-full pt-14 pb-safe px-margin bg-surface"><div class="flex flex-col w-full pb-6 space-y-4">
<!-- Top Segmented Controls Row -->
<div class="flex items-center justify-between pt-1">
<button aria-label="Dismiss quick add" class="w-10 h-10 rounded-full bg-surface-container border border-[#2a2a2a] flex items-center justify-center text-on-surface active:scale-95 transition-transform hover:bg-[#252525]" type="button">

<span class="font-label-caps text-label-caps">mon</span>
</button>
<button class="flex flex-col items-center px-4 py-1.5 rounded-full bg-primary text-on-primary shadow-sm" type="button">
<span class="font-numeric-sm text-numeric-sm font-semibold">13</span>
<span class="font-label-caps text-label-caps font-semibold">tue</span>
</button>
<button class="flex flex-col items-center px-3 py-1.5 rounded-full text-secondary hover:text-on-surface transition-colors" type="button">
<span class="font-numeric-sm text-numeric-sm">14</span>
<span class="font-label-caps text-label-caps">wed</span>
</button>
<button class="flex flex-col items-center px-3 py-1.5 rounded-full text-secondary hover:text-on-surface transition-colors" type="button">
<span class="font-numeric-sm text-numeric-sm">15</span>
<span class="font-label-caps text-label-caps">thu</span>

<!-- Active Amount Display -->
<div class="flex items-baseline justify-center tracking-tight text-white my-1">
<span class="font-display-currency-mobile text-display-currency-mobile tracking-tighter text-white font-bold" id="amount-val">
        $20.00
      </span>
<span class="w-0.5 h-8 bg-primary ml-1.5 animate-pulse"></span>
</div>
<!-- Merchant / Category Selector Pill -->
<button class="mt-2 bg-[#181818] border border-[#2e2e2e] text-white px-4 py-2 rounded-full font-label-caps text-label-caps inline-flex items-center gap-1.5 active:scale-95 transition-all shadow-sm hover:border-[#444444]" type="button">
<span class="text-[14px]">🍔</span>
<span class="tracking-wider text-white">burger king</span>
<span class="material-symbols-outlined text-[16px] text-[#8e8e93]">keyboard_arrow_down</span>
</button>
</div>
<!-- Action Helpers Row -->
<div class="flex items-center justify-center gap-2 overflow-x-auto py-1">
<button class="bg-[#181818] border border-[#2e2e2e] text-white font-label-caps text-label-caps py-2 px-3.5 rounded-full flex items-center gap-1.5 hover:bg-[#222222] hover:border-[#3e3e3e] transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined text-[16px] text-white">bolt</span>
<span>split bill</span>
</button>
<button class="bg-[#181818] border border-[#2e2e2e] text-white font-label-caps text-label-caps py-2 px-3.5 rounded-full flex items-center gap-1.5 hover:bg-[#222222] hover:border-[#3e3e3e] transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined text-[16px] text-white">attach_file</span>
<span>scan receipt</span>
</button>
<button class="bg-[#181818] border border-[#2e2e2e] text-white font-label-caps text-label-caps py-2 px-3.5 rounded-full flex items-center gap-1.5 hover:bg-[#222222] hover:border-[#3e3e3e] transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined text-[16px] text-white">credit_card</span>
<span>cash / bank</span>
<span class="material-symbols-outlined text-[14px] text-secondary">expand_more</span>
</button>
</div>
<!-- Note / Tag Input Row -->
<div class="w-full px-2 pt-1 pb-2">
<div class="flex items-center gap-2 bg-[#141414] border border-[#262626] px-4 py-2.5 rounded-full focus-within:border-[#444]">
<span class="material-symbols-outlined text-[18px] text-secondary">edit_note</span>
<input class="w-full bg-transparent font-body-md text-body-md text-white placeholder:text-secondary focus:outline-none" id="note-input" placeholder="add note or #tags..." type="text"/>
<button aria-label="Clear note" class="text-secondary hover:text-white" type="button">
<span class="material-symbols-outlined text-[16px]">tag</span>
</button>
</div>
</div>
<!-- Numeric Dial Pad (4x3 Grid) -->
<div class="grid grid-cols-3 gap-y-3.5 gap-x-6 max-w-[320px] mx-auto w-full pt-1 pb-2">
<!-- Row 1 -->
<button class="keypad-btn w-16 h-16 rounded-full bg-[#1c1c1c] hover:bg-[#262626] active:bg-white active:text-black font-numeric-tabular text-headline-md text-white flex items-center justify-center mx-auto transition-all active:scale-95 border border-[#282828]/50" data-key="1" type="button">
      1
    </button>
<button class="keypad-btn w-16 h-16 rounded-full bg-[#1c1c1c] hover:bg-[#262626] active:bg-white active:text-black font-numeric-tabular text-headline-md text-white flex items-center justify-center mx-auto transition-all active:scale-95 border border-[#282828]/50" data-key="2" type="button">
      2
    </button>
<button class="keypad-btn w-16 h-16 rounded-full bg-[#1c1c1c] hover:bg-[#262626] active:bg-white active:text-black font-numeric-tabular text-headline-md text-white flex items-center justify-center mx-auto transition-all active:scale-95 border border-[#282828]/50" data-key="3" type="button">
      3
    </button>
<!-- Row 2 -->
<button class="keypad-btn w-16 h-16 rounded-full bg-[#1c1c1c] hover:bg-[#262626] active:bg-white active:text-black font-numeric-tabular text-headline-md text-white flex items-center justify-center mx-auto transition-all active:scale-95 border border-[#282828]/50" data-key="4" type="button">
      4
    </button>
<button class="keypad-btn w-16 h-16 rounded-full bg-[#1c1c1c] hover:bg-[#262626] active:bg-white active:text-black font-numeric-tabular text-headline-md text-white flex items-center justify-center mx-auto transition-all active:scale-95 border border-[#282828]/50" data-key="5" type="button">
      5
    </button>
<button class="keypad-btn w-16 h-16 rounded-full bg-[#1c1c1c] hover:bg-[#262626] active:bg-white active:text-black font-numeric-tabular text-headline-md text-white flex items-center justify-center mx-auto transition-all active:scale-95 border border-[#282828]/50" data-key="6" type="button">
      6
    </button>
<!-- Row 3 -->
<button class="keypad-btn w-16 h-16 rounded-full bg-[#1c1c1c] hover:bg-[#262626] active:bg-white active:text-black font-numeric-tabular text-headline-md text-white flex items-center justify-center mx-auto transition-all active:scale-95 border border-[#282828]/50" data-key="7" type="button">
      7
    </button>
<button class="keypad-btn w-16 h-16 rounded-full bg-[#1c1c1c] hover:bg-[#262626] active:bg-white active:text-black font-numeric-tabular text-headline-md text-white flex items-center justify-center mx-auto transition-all active:scale-95 border border-[#282828]/50" data-key="8" type="button">
      8
    </button>
<button class="keypad-btn w-16 h-16 rounded-full bg-[#1c1c1c] hover:bg-[#262626] active:bg-white active:text-black font-numeric-tabular text-headline-md text-white flex items-center justify-center mx-auto transition-all active:scale-95 border border-[#282828]/50" data-key="9" type="button">
      9
    </button>
<!-- Row 4 -->
<button class="keypad-btn w-16 h-16 rounded-full bg-[#1c1c1c] hover:bg-[#262626] active:bg-white active:text-black font-numeric-tabular text-headline-md text-white flex items-center justify-center mx-auto transition-all active:scale-95 border border-[#282828]/50" data-key="." type="button">
      .
    </button>
<button class="keypad-btn w-16 h-16 rounded-full bg-[#1c1c1c] hover:bg-[#262626] active:bg-white active:text-black font-numeric-tabular text-headline-md text-white flex items-center justify-center mx-auto transition-all active:scale-95 border border-[#282828]/50" data-key="0" type="button">
      0
    </button>
<button class="w-16 h-16 rounded-full bg-white hover:bg-neutral-200 active:scale-90 text-black flex items-center justify-center mx-auto transition-all shadow-lg" id="submit-btn" type="button">
<span class="material-symbols-outlined text-[26px] text-black font-bold">check</span>
</button>
</div>
</div>
<script>
  (function() {
    let currentInput = "20.00";
    const amountEl = document.getElementById("amount-val");
    const keypadButtons = document.querySelectorAll(".keypad-btn");
    const expenseBtn = document.getElementById("type-expense");
    const incomeBtn = document.getElementById("type-income");

    function renderAmount() {
      if (!currentInput || currentInput === "0") {
        amountEl.textContent = "$0";
        return;
      }
      amountEl.textContent = "$" + currentInput;
    }

    keypadButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        const key = btn.getAttribute("data-key");
        if (key === ".") {
          if (!currentInput.includes(".")) {
            currentInput += ".";
          }
        } else {
          if (currentInput === "0" || currentInput === "20.00") {
            currentInput = key;
          } else {
            // Cap reasonable entry length
            if (currentInput.length < 9) {
              currentInput += key;
            }
          }
        }
        renderAmount();
      });
    });

    if (expenseBtn && incomeBtn) {
      expenseBtn.addEventListener("click", () => {
        expenseBtn.className = "bg-primary text-on-primary font-label-caps text-label-caps px-5 py-1.5 rounded-full transition-all font-semibold";
        incomeBtn.className = "text-secondary font-label-caps text-label-caps px-5 py-1.5 rounded-full transition-all hover:text-on-surface";
      });
      incomeBtn.addEventListener("click", () => {
        incomeBtn.className = "bg-primary text-on-primary font-label-caps text-label-caps px-5 py-1.5 rounded-full transition-all font-semibold";
        expenseBtn.className = "text-secondary font-label-caps text-label-caps px-5 py-1.5 rounded-full transition-all hover:text-on-surface";
      });
    }

    const submitBtn = document.getElementById("submit-btn");
    if (submitBtn) {
      submitBtn.addEventListener("click", () => {
        submitBtn.classList.add("scale-110");
        setTimeout(() => {
          submitBtn.classList.remove("scale-110");
        }, 150);
      });
    }
  })();
</script></main></body></html>
