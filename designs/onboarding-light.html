<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "outline-variant": "#cfc4c5", "surface-variant": "#e2e2e2", "surface-container-highest": "#e2e2e2", "surface-container": "#eeeeee", "surface-bright": "#f9f9f9", "on-tertiary-fixed": "#1b1b1b", "primary-fixed": "#e2e2e2", "on-error-container": "#93000a", "surface-tint": "#5e5e5e", "on-secondary-container": "#646464", "inverse-surface": "#2f3131", "on-background": "#1a1c1c", "on-primary-fixed-variant": "#474747", "on-surface-variant": "#4c4546", "primary-container": "#1b1b1b", "secondary": "#5e5e5e", "background": "#f9f9f9", "on-primary": "#ffffff", "tertiary-fixed-dim": "#c6c6c6", "on-primary-container": "#848484", "on-error": "#ffffff", "surface-container-high": "#e8e8e8", "outline": "#7e7576", "error": "#ba1a1a", "on-secondary-fixed-variant": "#464747", "on-tertiary-fixed-variant": "#474747", "secondary-fixed-dim": "#c7c6c6", "on-tertiary-container": "#848484", "surface": "#f9f9f9", "secondary-container": "#e3e2e2", "on-tertiary": "#ffffff", "tertiary-fixed": "#e2e2e2", "primary": "#000000", "error-container": "#ffdad6", "surface-dim": "#dadada", "inverse-primary": "#c6c6c6", "surface-container-lowest": "#ffffff", "on-secondary": "#ffffff", "primary-fixed-dim": "#c6c6c6", "on-secondary-fixed": "#1b1c1c", "secondary-fixed": "#e3e2e2", "on-surface": "#1a1c1c", "surface-container-low": "#f3f3f3", "on-primary-fixed": "#1b1b1b", "tertiary": "#000000", "tertiary-container": "#1b1b1b", "inverse-on-surface": "#f1f1f1" }, borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, spacing: { "space-md": "1rem", "space-lg": "1.5rem", "space-xs": "0.25rem", "gutter": "1rem", "space-sm": "0.5rem", "space-xl": "2.5rem", "margin": "1.25rem" }, fontFamily: { "label-subtle": ["Inter"], "numeric-sm": ["Inter"], "numeric-tabular": ["Inter"], "display-currency-mobile": ["Inter"], "body-lg": ["Inter"], "body-md": ["Inter"], "headline-md": ["Inter"], "label-caps": ["Inter"], "headline-lg": ["Inter"], "display-currency": ["Inter"] }, fontSize: { "label-subtle": ["12px", {"lineHeight": "16px", "letterSpacing": "0em", "fontWeight": "400"}], "numeric-sm": ["13px", {"lineHeight": "16px", "letterSpacing": "0em", "fontWeight": "600"}], "numeric-tabular": ["16px", {"lineHeight": "20px", "letterSpacing": "-0.01em", "fontWeight": "600"}], "display-currency-mobile": ["38px", {"lineHeight": "42px", "letterSpacing": "-0.03em", "fontWeight": "700"}], "body-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "400"}], "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400"}], "headline-md": ["20px", {"lineHeight": "26px", "letterSpacing": "-0.01em", "fontWeight": "600"}], "label-caps": ["11px", {"lineHeight": "14px", "letterSpacing": "0.06em", "fontWeight": "500"}], "headline-lg": ["24px", {"lineHeight": "30px", "letterSpacing": "-0.02em", "fontWeight": "600"}], "display-currency": ["48px", {"lineHeight": "52px", "letterSpacing": "-0.04em", "fontWeight": "700"}] } } } };</script></head><body class="bg-surface font-body-md text-on-surface antialiased min-h-screen pt-safe pb-safe flex flex-col justify-center"><main class="flex flex-col relative w-full px-margin bg-surface"><div class="flex flex-col w-full min-h-[82vh] justify-between items-center select-none py-space-md">
<!-- Subtle Top Spatial Micro-indicator -->
<div class="w-full flex items-center justify-between px-space-xs pt-space-xs">
<div class="flex items-center space-x-1">
<div class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></div>
<span class="font-label-caps text-label-caps uppercase tracking-widest text-on-surface-variant">v1.0 • offline ready</span>
</div>
<div class="h-6 px-space-sm rounded-full bg-surface-container flex items-center">
<span class="font-label-caps text-label-caps text-on-surface-variant">monochrome</span>
</div>
</div>
<!-- Center Stage: Hero Illustration & Orbiting Mental-Map Tags -->
<div class="relative w-full max-w-[340px] aspect-square flex items-center justify-center my-auto">
<!-- Connecting Vector Constellation Lines -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" fill="none" viewbox="0 0 340 340" xmlns="http://www.w3.org/2000/svg">
<!-- Curved connecting dotted arcs -->
<path d="M 68 85 C 105 105, 120 135, 140 150" stroke="#7e7576" stroke-dasharray="3 4" stroke-opacity="0.4" stroke-width="1"></path>
<path d="M 270 70 C 230 95, 205 125, 195 150" stroke="#7e7576" stroke-dasharray="3 4" stroke-opacity="0.4" stroke-width="1"></path>
<path d="M 40 185 C 80 180, 110 180, 130 180" stroke="#7e7576" stroke-dasharray="3 4" stroke-opacity="0.4" stroke-width="1"></path>
<path d="M 295 185 C 260 185, 230 185, 205 185" stroke="#7e7576" stroke-dasharray="3 4" stroke-opacity="0.4" stroke-width="1"></path>
<path d="M 85 275 C 110 245, 135 220, 150 205" stroke="#7e7576" stroke-dasharray="3 4" stroke-opacity="0.4" stroke-width="1"></path>
<path d="M 260 270 C 230 240, 205 215, 190 205" stroke="#7e7576" stroke-dasharray="3 4" stroke-opacity="0.4" stroke-width="1"></path>
</svg>
<!-- Center Avatar Circle Container -->
<div class="relative z-10 w-36 h-36 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center p-1.5 transition-transform duration-500 hover:scale-105 active:scale-95" id="hero-avatar">
<div class="w-full h-full rounded-full overflow-hidden bg-surface-container-low flex items-center justify-center">
<img alt="Pilu Character Line Art" class="w-full h-full object-cover grayscale contrast-125" src="https://lh3.googleusercontent.com/aida/ALJJyrDpMNnjojhc77tbkUFWJkiBK459sYew1814QocxFzOywLt1UXLQcTvCBdZpkgvxhl_xjCDOhNVAsCI--tOn-zLi41F0UTIZM800MpKNg8cQsqNIpYxgxvx9US_5QYLSogPaerqxRZ88x7YRI9m8VRODjXDv4rjAc9LKTsw67ckbdiI843ynR-OtJQX4QXCI591CpGh8zUqGftdjPb_UwUW_SvDNvJBKt7aOLIYVJDchnQ"/>
</div>
<!-- Subtle ring anchor tick mark -->
<div class="absolute -bottom-1 w-2 h-2 rounded-full bg-primary"></div>
</div>
<!-- Floating Pill 1: "balance" (top-left) -->
<div class="absolute top-8 left-2 z-20 px-3.5 py-1 rounded-full bg-surface-container-lowest text-on-surface shadow-sm cursor-pointer transition-all duration-300 hover:bg-primary hover:text-on-primary active:scale-95" data-floating-pill="">
<span class="font-numeric-sm text-numeric-sm tracking-tight">balance</span>
</div>
<!-- Floating Pill 2: "income" (top-right) -->
<div class="absolute top-4 right-5 z-20 px-3.5 py-1 rounded-full bg-surface-container-lowest text-on-surface shadow-sm cursor-pointer transition-all duration-300 hover:bg-primary hover:text-on-primary active:scale-95" data-floating-pill="">
<span class="font-numeric-sm text-numeric-sm tracking-tight">+ income</span>
</div>
<!-- Floating Pill 3: "expenses" (mid-left - inverted anchor) -->
<div class="absolute top-[48%] -left-1 transform -translate-y-1/2 z-20 px-4 py-1.5 rounded-full bg-primary text-on-primary shadow-md cursor-pointer transition-all duration-300 hover:bg-surface-variant hover:text-on-surface active:scale-95 flex items-center space-x-1" data-floating-pill="">
<span class="font-numeric-sm text-numeric-sm font-semibold tracking-tight">expenses</span>
<span class="text-[10px] leading-none opacity-70">●</span>
</div>
<!-- Floating Pill 4: "food" (mid-right) -->
<div class="absolute top-[48%] -right-1 transform -translate-y-1/2 z-20 px-3.5 py-1 rounded-full bg-surface-container-lowest text-on-surface shadow-sm cursor-pointer transition-all duration-300 hover:bg-primary hover:text-on-primary active:scale-95" data-floating-pill="">
<span class="font-numeric-sm text-numeric-sm tracking-tight">food</span>
</div>
<!-- Floating Pill 5: "travel" (bottom-left) -->
<div class="absolute bottom-6 left-5 z-20 px-3.5 py-1 rounded-full bg-surface-container-lowest text-on-surface shadow-sm cursor-pointer transition-all duration-300 hover:bg-primary hover:text-on-primary active:scale-95" data-floating-pill="">
<span class="font-numeric-sm text-numeric-sm tracking-tight">travel</span>
</div>
<!-- Floating Pill 6: "fun" (bottom-right) -->
<div class="absolute bottom-7 right-4 z-20 px-3.5 py-1 rounded-full bg-surface-container-lowest text-on-surface shadow-sm cursor-pointer transition-all duration-300 hover:bg-primary hover:text-on-primary active:scale-95" data-floating-pill="">
<span class="font-numeric-sm text-numeric-sm tracking-tight">fun ✦</span>
</div>
</div>
<!-- Bottom Branding & Action Block -->
<div class="w-full flex flex-col items-center mt-auto pb-space-sm">
<!-- Brand Title & Tagline -->
<div class="flex flex-col items-center text-center space-y-1">
<div class="flex items-center space-x-2">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tighter lowercase text-4xl">pilu</h1>
<div class="h-2 w-2 rounded-full bg-primary mb-1"></div>
</div>
<p class="font-body-md text-body-md text-on-surface-variant font-normal tracking-wide">
        your minimal budgeting app
      </p>
</div>
<!-- Primary Action CTA -->
<div class="w-full mt-space-lg">
<button class="w-full py-4 bg-primary text-on-primary font-body-lg text-body-lg font-medium rounded-full shadow-md flex items-center justify-center space-x-2 transition-all duration-200 active:scale-[0.98] hover:bg-inverse-surface" id="btn-get-started" type="button">
<span>get started</span>
<span class="material-symbols-outlined text-body-lg">arrow_forward</span>
</button>
</div>
<!-- Secondary Restore Trigger -->
<div class="mt-space-md flex flex-col items-center">
<button class="group flex items-center space-x-1.5 py-1 px-3 rounded-full hover:bg-surface-container transition-colors" id="btn-restore" type="button">
<span class="font-label-subtle text-label-subtle text-on-surface-variant">already tracked?</span>
<span class="font-label-subtle text-label-subtle text-primary font-medium underline underline-offset-4 decoration-outline-variant group-hover:decoration-primary transition-all">restore backup</span>
</button>
</div>
<!-- Monospaced Zen Statement -->
<div class="mt-space-md pt-space-xs flex items-center justify-center space-x-2 text-on-surface-variant opacity-60">
<span class="font-label-caps text-label-caps tracking-widest uppercase">zero clutter • local first</span>
</div>
</div>
</div>
<script>
  (function() {
    // Micro-interaction: Organic gentle float animation on pill tags
    const pills = document.querySelectorAll('[data-floating-pill]');
    const avatar = document.getElementById('hero-avatar');

    pills.forEach((pill, idx) => {
      const delay = idx * 180;
      pill.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s, color 0.2s';
      
      pill.addEventListener('click', () => {
        // Playful bounce on tap
        pill.style.transform = 'scale(1.15) rotate(' + (idx % 2 === 0 ? '-3deg' : '3deg') + ')';
        setTimeout(() => {
          pill.style.transform = 'scale(1) rotate(0deg)';
        }, 250);

        if (avatar) {
          avatar.style.transform = 'scale(1.04)';
          setTimeout(() => { avatar.style.transform = 'scale(1)'; }, 200);
        }
      });
    });

    const getStartedBtn = document.getElementById('btn-get-started');
    if (getStartedBtn) {
      getStartedBtn.addEventListener('click', function(e) {
        this.classList.add('scale-95');
        setTimeout(() => {
          this.classList.remove('scale-95');
        }, 150);
      });
    }
  })();
</script></main></body></html>
